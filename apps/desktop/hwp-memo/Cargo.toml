[package]
name = "hop-hwp-memo"
version = "0.1.0"
edition = "2021"
publish = false
description = "HWP/HWPX 메모(주석) 읽기와, 엔진이 버린 메모 본문을 저장 때 되살리기"

[dependencies]
# rhwp 와 같은 버전대를 쓴다 (third_party/rhwp/Cargo.toml)
cfb = "0.14"
flate2 = "1.0"
zip = { version = "8.5", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
